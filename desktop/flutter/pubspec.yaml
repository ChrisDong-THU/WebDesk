name: webdesk
description: WebDesk Windows host for the existing browser controller.
publish_to: none
version: 0.5.8+9
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc:
    path: ../../third_party/flutter-webrtc
  socket_io_client: ^3.1.2
  window_manager: ^0.5.1
  tray_manager:
    path: ../../third_party/tray_manager
  path_provider: ^2.1.5
  path: ^1.9.1
  file_selector: ^1.0.4
  flutter_svg: ^2.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/webdesk-icon.svg
    - assets/webdesk.ico
