name: Bug report / 问题反馈
description: 报告可复现的问题
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: WebDesk 版本
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、浏览器、直连或中继；请勿填写密码或密钥。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期与实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 删除设备代码、密码、服务器密钥和个人文件信息。
