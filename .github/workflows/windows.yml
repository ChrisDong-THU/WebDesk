name: Windows build
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'native/**'
      - 'build/**'
      - 'scripts/build-flutter.ps1'
      - 'scripts/prepare-flutter.ps1'
      - 'scripts/setup-inno.ps1'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        # Match npm's Windows PowerShell build scripts and module search path.
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: ./scripts/setup-inno.ps1
      - run: npm run build:inno
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: |
            flutter-release/*/*.exe
            flutter-release/*/*.sha256
          if-no-files-found: error
